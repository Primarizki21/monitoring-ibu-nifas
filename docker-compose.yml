services:
  db:
    image: postgres:16-alpine
    container_name: nifas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nifas_user
      POSTGRES_PASSWORD: nifas_secret_password
      POSTGRES_DB: nifas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nifas_user -d nifas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
